<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعیت مکانی من</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 { color: #1a73e8; margin-bottom: 1.5rem; }
        .coord-box {
            background: #e8f0fe;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            border: 1px solid #c2d7ff;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
            width: 100%;
        }
        button:hover { background-color: #1557b0; }
        #status { margin-top: 15px; font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>
    <div class="card">
        <h1>موقعیت جغرافیایی</h1>
        <div class="coord-box">
            عرض جغرافیایی (Lat): <br>
            <span id="lat">---</span>
        </div>
        <div class="coord-box">
            طول جغرافیایی (Lon): <br>
            <span id="lon">---</span>
        </div>
        <button onclick="getLocation()">به‌روزرسانی موقعیت</button>
        <div id="status">برای شروع، دکمه بالا را بزنید.</div>
    </div>
    <script>
        const latDisplay = document.getElementById('lat');
        const lonDisplay = document.getElementById('lon');
        const statusDisplay = document.getElementById('status');
        function getLocation() {
            statusDisplay.innerText = "در حال دریافت اطلاعات...";
            // بررسی اینکه آیا مرورگر از Geolocation پشتیبانی می‌کند
            if (navigator.geolocation) {
                // درخواست موقعیت با تنظیمات دقت بالا
                navigator.geolocation.getCurrentPosition(showPosition, showError, {
                    enableHighAccuracy: false, 
                    timeout: 10000, 
                    maximumAge: 0
                });
            } else {
                statusDisplay.innerText = "متأسفانه مرورگر شما از این قابلیت پشتیبانی نمی‌کند.";
            }
        }
        function showPosition(position) {
            latDisplay.innerText = position.coords.latitude.toFixed(6);
            lonDisplay.innerText = position.coords.longitude.toFixed(6);
            statusDisplay.innerText = "موقعیت با موفقیت دریافت شد ✅";
            statusDisplay.style.color = "green";
        }
        function showError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    statusDisplay.innerText = "خطا: اجازه دسترسی به لوکیشن داده نشد. ❌";
                    break;
                case error.POSITION_UNAVAILABLE:
                    statusDisplay.innerText = "خطا: اطلاعات موقعیت در دسترس نیست. ❌";
                    break;
                case error.TIMEOUT:
                    statusDisplay.innerText = "خطا: زمان درخواست به پایان رسید. ❌";
                    break;
                case error.UNKNOWN_ERROR:
                    statusDisplay.innerText = "خطای ناشناخته‌ای رخ داد. ❌";
                    break;
            }
            statusDisplay.style.color = "red";
        }
    </script>
</body>
</html>
